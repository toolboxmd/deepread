<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Read</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("deepread-theme") || "paper";</script>
</head>
<body data-view="search">
  <div class="themes" role="radiogroup" aria-label="Theme">
    <button data-theme-choice="paper" role="radio" aria-label="Paper theme" title="Paper"></button>
    <button data-theme-choice="white" role="radio" aria-label="White theme" title="White"></button>
    <button data-theme-choice="black" role="radio" aria-label="Black theme" title="Black"></button>
  </div>

  <main class="search">
    <h1 class="brand">Deep Read</h1>
    <p class="tagline">One topic. As deep as you care to read.</p>
    <form id="search-form" autocomplete="off">
      <input id="topic" name="topic" maxlength="200" placeholder="What do you want to understand?" autofocus>
      <button type="submit">Read</button>
    </form>
  </main>

  <div class="reader">
    <header class="topbar">
      <a href="/" class="brand-small">Deep Read</a>
      <div class="progress"><span id="progress-bar"></span></div>
    </header>
    <article id="article"></article>
    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <div id="pace" class="pace" hidden>Reading pace</div>
  <div id="stats" class="stats" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
